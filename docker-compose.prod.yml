# Прод: образ из GHCR, обновления подхватывает Watchtower, наружу отдаёт общий
# nginx-proxy (TLS — acme-companion). Подробности — docs/DEPLOY.md.
#
# ⚠ На сервере лежат только этот файл, Makefile и .env. Репозитория там нет.
services:
  app:
    image: ghcr.io/bx-shef/get-task-from-b24:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Адреса зависимостей внутри compose-сети — перекрывают то, что в .env для локалки.
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app
      REDIS_URL: redis://redis:6379
      # Для nginx-proxy + acme-companion.
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: '3000'
      LETSENCRYPT_HOST: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    # ⚠ Контейнер смотрит в интернет и принимает POST от кого угодно. Ограничения
    # не «на всякий случай»: воркеры очереди живут в этом же процессе, поэтому его
    # падение по памяти означает остановку переносов у всех 20–30 клиентов сразу.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    networks:
      - default
      - proxy-net

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 10s
      timeout: 5s
      retries: 10
    # ⚠ Портов наружу нет намеренно: база доступна только по compose-сети.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ⚠ appendonly: очередь переживает перезапуск. Без него события, принятые за секунду
    # до рестарта, исчезают — а второй доставки у Битрикс24 нет.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  redis-data:

networks:
  proxy-net:
    external: true
